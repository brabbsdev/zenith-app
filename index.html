    <title>Zenith</title>
    <!--
      Pick the theme before anything paints, so there is no flash of the wrong one.
      Mirrors resolveTheme in src/lib/theme.ts: a saved Dark or Light wins, otherwise
      follow the system, and with no system preference stay dark.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('zenith.theme');
          var systemLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = saved === 'dark' || saved === 'light' ? saved : systemLight ? 'light' : 'dark';
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var colour = theme === 'light' ? '#ffffff' : '#000000';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', colour);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute('content', theme);
      })();
    </script>
